version: katana-collection-v1
output: data/runs
ner_backend: models
english_model: knowledgator/gliner-relex-base-v1.0
vietnamese_model: belumind/barb-2-ie-vi
aliases: config/entities.yaml
sources: config/sources.yaml
max_documents: 6000
max_articles: 6000
min_text_chars: 80
min_article_words: 100
allow_excerpts: false
near_duplicate_threshold: 0.9
request_timeout: 30
max_response_bytes: 5000000
user_agent: WeconomyResearch/0.1 (local academic research; rate-limited)
targets:
  - id: vnexpress_world_business
    url: https://vnexpress.net/kinh-doanh/quoc-te
    source: vnexpress
    article_link_xpath: "//article[contains(concat(' ', normalize-space(@class), ' '), ' item-news ')]//a[@href]/@href"
    article_pattern: '-\d+\.html$'
    body_xpath: "//*[contains(concat(' ', normalize-space(@class), ' '), ' fck_detail ')]"
    language: vi
    max_articles: 1000
  - id: thanhnien_world_economy
    url: https://thanhnien.vn/the-gioi/kinh-te-the-gioi.htm
    source: thanhnien
    article_link_xpath: "//a[contains(concat(' ', normalize-space(@class), ' '), ' box-category-link-with-avatar ') or contains(concat(' ', normalize-space(@class), ' '), ' box-category-related-link-title ')]/@href"
    article_pattern: '-\d+\.htm$'
    body_xpath: "//*[contains(concat(' ', normalize-space(@class), ' '), ' detail-content ')]"
    language: vi
    max_articles: 1000
  - id: techcrunch_venture
    url: https://techcrunch.com/category/venture/
    source: techcrunch
    article_link_xpath: "//a[contains(concat(' ', normalize-space(@class), ' '), ' loop-card__title-link ')]/@href"
    article_pattern: '/\d{4}/\d{2}/\d{2}/[^/?#]+/?$'
    body_xpath: "//*[contains(concat(' ', normalize-space(@class), ' '), ' entry-content ')]"
    language: en
    max_articles: 1000
  - id: techcrunch_startups
    url: https://techcrunch.com/category/startups/
    source: techcrunch
    article_link_xpath: "//a[contains(concat(' ', normalize-space(@class), ' '), ' loop-card__title-link ')]/@href"
    article_pattern: '/\d{4}/\d{2}/\d{2}/[^/?#]+/?$'
    body_xpath: "//*[contains(concat(' ', normalize-space(@class), ' '), ' entry-content ')]"
    language: en
    max_articles: 1000
  - id: vneconomy_world_business
    url: https://vneconomy.vn/kinh-doanh-the-gioi.htm
    source: vneconomy
    article_link_xpath: "//main[contains(concat(' ', normalize-space(@class), ' '), ' news-category-spotlight__content ')]//article//a[@href]/@href"
    article_pattern: '\.htm$'
    body_xpath: "//*[@id='article-editor']"
    language: vi
    max_articles: 1000
  - id: 24h_world_economy
    url: https://www.24h.com.vn/kinh-te-the-gioi-c1106.html
    source: 24h
    article_link_xpath: "//section[contains(concat(' ', normalize-space(@class), ' '), ' section-tin-noi-bat ')]//article[contains(concat(' ', normalize-space(@class), ' '), ' cate-24h-foot-box ') or contains(concat(' ', normalize-space(@class), ' '), ' cate-24h-foot-home-latest-list__box ')]//a[@href]/@href"
    article_pattern: '/[^/?#]+-c\d+a\d+\.html$'
    body_xpath: "//*[@id='article_body']"
    language: vi
    max_articles: 1000
batch_size: 10
crawl:
  image: projectdiscovery/katana:latest
  depth: 1
  delay_seconds: 2
  max_pages_per_target: 1000
  crawl_duration: 30s
  timeout_seconds: 15
  max_response_bytes: 4194304
  concurrency: 1
objectives:
  articles: null
  nodes: 2000
  entities: null
  relations: 5000
  relation_types: 19
