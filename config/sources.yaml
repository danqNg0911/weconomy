sources:
  wikinews_en:
    hosts: [en.wikinews.org]
    language: en
    kind: news
    allowed: true
    permission_basis: Open licensed text; check per-page license; images excluded
    terms_url: https://en.wikinews.org/wiki/Wikinews:Copyright
    license: CC-BY-2.5-or-4.0-per-page
    min_interval_seconds: 2
    feeds: ["https://en.wikinews.org/w/index.php?title=Special:NewsFeed&feed=rss&categories=Published&notcategories=No%20publish%7CArchived%7CAutoArchived&namespace=0&count=10"]
  wikipedia_vi:
    hosts: [vi.wikipedia.org]
    language: vi
    kind: encyclopedia_reference
    allowed: true
    permission_basis: CC-BY-SA text only; contributors attributed by source history link
    terms_url: https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
    license: CC-BY-SA-4.0
    min_interval_seconds: 2
    feeds: []
  vnexpress:
    hosts: [vnexpress.net]
    language: vi
    kind: news
    allowed: false
    permission_basis: Pending documented permission and terms review; RSS is not a full-text license
