    language: en
    kind: news
    allowed: false
    permission_basis: Pending licensed access; no paywall or anti-bot bypass
    terms_url: https://www.reuters.com/info-pages/terms-of-use/
    license: permission-required
    min_interval_seconds: 5
    feeds: []
  bloomberg:
    hosts: [www.bloomberg.com, bloomberg.com]
    language: en
    kind: news
    allowed: false
    permission_basis: Pending licensed access; no paywall bypass
    terms_url: https://www.bloomberg.com/notices/tos/
