[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-collector"
version = "0.1.0"
description = "Bounded news crawling feasibility pilot"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "feedparser>=6,<7", "lxml>=5,<7", "lxml_html_clean>=0.4,<1", "beautifulsoup4>=4.12,<5", "trafilatura>=2,<3", "pydantic>=2,<3", "PyYAML>=6,<7", "typer>=0.12,<1", "rich>=13,<15", "python-dateutil>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-httpx>=0.30,<1"]

[project.scripts]
news-collector = "news_collector.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
