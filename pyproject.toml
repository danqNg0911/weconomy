[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weconomy"
version = "0.1.0"
description = "Evidence-first Vietnamese/English news knowledge graph"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "feedparser>=6.0,<7", "httpx>=0.28,<1", "trafilatura>=2.0,<3",
  "lxml>=5,<7",
  "pyarrow>=19,<24", "langdetect>=1.0.9,<2", "networkx>=3.4,<4",
  "neo4j>=5.26,<6", "PyYAML>=6,<7", "rapidfuzz>=3,<4", "scipy>=1.11,<2"
]

[project.optional-dependencies]
nlp = ["spacy>=3.8,<4", "underthesea>=6.8,<9"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
hub = ["huggingface-hub>=1,<3"]

[project.scripts]
weconomy = "weconomy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/weconomy"]
